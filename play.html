<script>
var GAMES = {
 "robo-popper": {
  "title": "Robo Popper",
  "made": "Phaser (JavaScript), 2017",
  "text": "Letter bubbles bounce around the screen; pop them in the order that spells the word for the most points. Teachers can enter their own word list with the settings button.",
  "kind": "wide",
  "src": "https://www.christiancalle.com/headergame/index.html"
 },
 "four-doors": {
  "title": "Four Doors",
  "made": "Phaser (JavaScript), 2017",
  "text": "A digital board game for the classroom. Students pick a fantasy character, explore the board, fight monsters and collect treasure, earning gold by answering review questions. Teachers type their vocabulary and expressions into the setup menu, and the game makes the questions. The character with the most gold, strength and health wins.",
  "kind": "wide",
  "src": "https://www.christiancalle.com/fourdoors/index.html"
 },
 "space-runner": {
  "title": "Space Runner",
  "made": "Phaser (JavaScript), unfinished",
  "text": "An endless runner: gather supplies for your ship by collecting as much space debris as you can. I stopped partway through, so it's a work in progress.",
  "kind": "wide",
  "src": "https://www.christiancalle.com/spacerunner/index.html"
 },
 "cursed-shadows": {
  "title": "Cursed Shadows",
  "made": "Unity (C#), early demo",
  "text": "You're an adventurer struck by a curse with a will of its own. It grows stronger as you do, and gives you advantages, but if it grows too strong it takes you over and you lose. An early demo of the basic systems; it wasn't made for the browser, so expect a few glitches.",
  "kind": "unity",
  "src": "cursedshadows-web/cursedshadows.html"
 },
 "circles-vs-squares": {
  "title": "Circles vs Squares: Circle's Fight",
  "made": "Multimedia Fusion 2 (Flash)",
  "text": "A five-level platformer for the classroom. The teacher enters vocabulary words first; students unscramble them to unlock each level.",
  "kind": "flash",
  "src": "games/circlesrun.swf"
 },
 "space-hangman": {
  "title": "Circles vs Squares 2: Space Hangman",
  "made": "Multimedia Fusion 2 (Flash)",
  "text": "Hangman aboard a spaceship. Use Set up to enter the words for your class, then Play.",
  "kind": "flash",
  "src": "games/spacehangman.swf"
 },
 "daehans-adventure": {
  "title": "Daehan's Adventure",
  "made": "Multimedia Fusion 2 (Flash)",
  "text": "A side-scrolling adventure built around review questions. On the input screen, select the sample questions, then press F1 on your keyboard to start.",
  "kind": "flash",
  "src": "games/daehansadventure.swf"
 }
};
(function () {
  var id = location.hash.slice(1);
  var g = GAMES[id];
  if (!g) { location.replace('games.html'); return; }
  document.title = g.title + ' | Christian Calle';
  document.getElementById('game-title').textContent = g.title;
  document.getElementById('game-made').textContent = g.made;
  document.getElementById('game-text').textContent = g.text;
  var stage = document.getElementById('stage');
  stage.classList.add(g.kind);
  if (g.kind === 'flash') {
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = { autoplay: 'on', unmuteOverlay: 'hidden', letterbox: 'on' };
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/@ruffle-rs/ruffle@0.7.1/ruffle.js';
    s.onload = function () {
      var player = window.RufflePlayer.newest().createPlayer();
      player.setAttribute('aria-label', g.title);
      stage.appendChild(player);
      player.ruffle().load(g.src);
    };
    document.head.appendChild(s);
  } else {
    var f = document.createElement('iframe');
    f.src = g.src;
    f.title = g.title;
    f.setAttribute('allow', 'fullscreen; autoplay');
    stage.appendChild(f);
  }
})();
window.addEventListener('hashchange', function () { location.reload(); });
</script>
</body>
